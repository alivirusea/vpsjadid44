name: Windows VPS

on:
  workflow_dispatch:

jobs:
  windows-vps:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

      - name: Create RDP User
        shell: powershell
        run: |
          $password = [System.Web.Security.Membership]::GeneratePassword(20, 4)
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser `
            -Name "VPSUser" `
            -Password $secure `
            -AccountNeverExpires `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "VPSUser"

          "RDP_USERNAME=VPSUser" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          Invoke-WebRequest $url -OutFile "$env:TEMP\tailscale.msi"

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet /norestart" `
            -Wait

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="github-windows-vps"

          Start-Sleep -Seconds 10

          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          "RDP_IP=$ip" >> $env:GITHUB_ENV

      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "       WINDOWS VPS IS READY"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "RDP IP:"
          Write-Host $env:RDP_IP
          Write-Host ""
          Write-Host "Username:"
          Write-Host $env:RDP_USERNAME
          Write-Host ""
          Write-Host "Password:"
          Write-Host $env:RDP_PASSWORD
          Write-Host ""
          Write-Host "======================================"
          Write-Host "Keep this GitHub Action running."
          Write-Host "======================================"
          Write-Host ""

      - name: Keep VPS Alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "VPS is running: $(Get-Date)"
            Start-Sleep -Seconds 60
          }
