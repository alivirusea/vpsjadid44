name: Windows VPS

on:
  workflow_dispatch:

jobs:
  windows-vps:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:

      # ---------------------------------------
      # 1. Enable Remote Desktop
      # ---------------------------------------
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "Remote Desktop enabled."

      # ---------------------------------------
      # 2. Create RDP User
      # ---------------------------------------
      - name: Create RDP User
        shell: powershell
        run: |
          $chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*'
          
          $password = -join (1..20 | ForEach-Object {
            $chars[(Get-Random -Maximum $chars.Length)]
          })

          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser `
            -Name "VPSUser" `
            -Password $secure `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "Temporary GitHub Actions RDP user"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "VPSUser"

          "RDP_USERNAME=VPSUser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "RDP user created."

      # ---------------------------------------
      # 3. Install Tailscale
      # ---------------------------------------
      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Write-Host "Installing Tailscale..."

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Write-Host "Tailscale installed."

      # ---------------------------------------
      # 4. Connect Tailscale
      # ---------------------------------------
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            Write-Error "TS_AUTHKEY GitHub Secret is missing."
            exit 1
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            Write-Error "Tailscale executable was not found."
            exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="github-windows-vps"

          Start-Sleep -Seconds 10

          $ip = & $tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($ip)) {
            Write-Error "Could not get Tailscale IP."
            exit 1
          }

          "RDP_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Tailscale connected."

      # ---------------------------------------
      # 5. Display RDP Information
      # ---------------------------------------
      - name: Show RDP Information
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          WINDOWS VPS IS READY"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "RDP IP:"
          Write-Host $env:RDP_IP

          Write-Host ""

          Write-Host "Username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""

          Write-Host "Password:"
          Write-Host $env:RDP_PASSWORD

          Write-Host ""

          Write-Host "=========================================="
          Write-Host "Connect using Windows Remote Desktop:"
          Write-Host "Win + R -> mstsc"
          Write-Host "=========================================="
          Write-Host ""

      # ---------------------------------------
      # 6. Keep Job Running
      # ---------------------------------------
      - name: Keep VPS Alive
        shell: powershell
        run: |

          Write-Host "Windows VPS is running."

          while ($true) {

            Write-Host "VPS running: $(Get-Date)"

            Start-Sleep -Seconds 60
          }
